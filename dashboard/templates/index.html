<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaurdin Content OS Lite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --color-bg-default: #080c14;
            --color-bg-alt: #0d1422;
            --color-bg-deep: #111827;
            
            --color-surface-default: #141d2e;
            --color-surface-hover: #1a2540;
            
            --color-border: rgba(255, 255, 255, 0.07);
            
            --color-accent-primary: #4f6ef7;
            --color-accent-secondary: #8b5cf6;
            
            --color-text-primary: #e8eaf6;
            --color-text-muted: #8892a4;
            
            --radius-base: 14px;
            --radius-lg: 22px;
            
            --shadow-default: 0 8px 40px rgba(0,0,0,.45);
            --shadow-glow: 0 0 40px rgba(79,110,247,.25);

            --font-head: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--color-bg-default);
            color: var(--color-text-primary);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.65;
            overflow-x: hidden;
            min-height: 100vh;
        }

        h1, h2, h3, h4 { 
            font-family: var(--font-head); 
            line-height: 1.2; 
            letter-spacing: -.03em; 
        }

        /* Utilities */
        .text-grad-primary {
            background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bg-grad-primary {
            background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-secondary));
        }

        .bg-grad-soft {
            background: linear-gradient(135deg, rgba(79,110,247,.15), rgba(139,92,246,.15));
        }

        /* Layout */
        .page-wrapper {
            min-height: 100vh;
            padding-top: 70px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        @media (min-width: 640px) {
            .header-container {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .header-title {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
        }

        .header-subtitle {
            color: var(--color-text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button, .btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            background: transparent;
            font-family: var(--font-body);
        }

        button:hover, .btn:hover {
            border-color: var(--color-accent-primary);
            color: var(--color-text-primary);
        }

        button.primary {
            background: linear-gradient(135deg, var(--color-accent-primary), var(--color-accent-secondary));
            color: white;
            border: none;
            padding: 8px 20px;
        }

        button.primary:hover {
            opacity: 0.9;
        }

        /* History Section */
        .history-section {
            margin-top: 2rem;
        }

        .history-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (min-width: 640px) {
            .history-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 1024px) {
            .history-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .history-item {
            background: var(--color-surface-default);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .history-item:hover {
            border-color: var(--color-accent-primary);
        }

        .item-header-visual {
            position: relative;
            height: 120px;
            background: var(--color-bg-deep);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-header-visual.bg-grad-soft {
            background: linear-gradient(135deg, rgba(79,110,247,.15), rgba(139,92,246,.15));
        }

        .item-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.62rem;
            font-weight: 700;
            background: rgba(79,110,247,0.9);
            color: white;
            text-transform: uppercase;
        }

        .item-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .item-topic {
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.3;
            margin-bottom: 12px;
            color: var(--color-text-primary);
        }

        .item-content {
            color: var(--color-text-muted);
            font-size: 0.8rem;
            background: var(--color-bg-deep);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            flex: 1;
            overflow-y: auto;
            max-height: 200px;
        }

        /* Rendered markdown styles */
        .item-content h1, .item-content h2, .item-content h3 {
            color: var(--color-text-primary);
            margin: 14px 0 6px;
            font-weight: 700;
        }
        .item-content h1 { font-size: 1.1rem; }
        .item-content h2 { font-size: 1rem; }
        .item-content h3 { font-size: 0.9rem; }
        .item-content p  { margin: 6px 0; line-height: 1.5; }
        .item-content ul, .item-content ol {
            padding-left: 20px;
            margin: 6px 0;
        }
        .item-content strong { color: #e8eaf6; }
        .item-content code {
            background: rgba(255,255,255,0.05);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85em;
        }
        .item-content pre {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            border-color: var(--color-accent-primary);
            color: var(--color-text-primary);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-base);
        }

        /* Notification Toast */
        .notification {
            position: fixed;
            top: 96px;
            right: 20px;
            z-index: 100;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow-default);
            border: 1px solid;
            transform: translateY(-20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 340px;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .notification.success {
            background: rgba(79,247,150,0.12);
            border-color: rgba(79,247,150,0.25);
            color: #34d399;
        }

        .notification.error {
            background: rgba(247,79,79,0.12);
            border-color: rgba(247,79,79,0.25);
            color: #f87171;
        }

        /* Loader */
        #loading-overlay {
            display: none;
            position: fixed; 
            inset: 0;
            background: rgba(8,12,20,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .spinner {
            width: 48px; 
            height: 48px;
            border: 3px solid rgba(79,110,247,0.2);
            border-top-color: var(--color-accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--color-bg-default); }
        ::-webkit-scrollbar-thumb { background: var(--color-accent-primary); border-radius: 3px; }

        /* Mobile Optimization */
        @media (max-width: 640px) {
            .page-wrapper { padding-top: 20px; }
            .container { padding: 20px 16px; }
            .header-title { font-size: 2.2rem; }
            .controls { display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 8px; }
            .controls button.primary { grid-column: span 2; }
            .notification { right: 16px; left: 16px; max-width: none; top: 20px; text-align: center; }
            .item-header-visual { height: 100px; }
            .item-body { padding: 16px; }
            .item-actions { flex-direction: column; gap: 8px; }
            .action-btn { padding: 10px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <!-- Header -->
            <header class="header-container">
                <div>
                    <h1 class="header-title">
                        Content <span class="text-grad-primary">OS</span>
                    </h1>
                    <p class="header-subtitle">
                        Autonomous Research & Generation System
                    </p>
                </div>
                <div class="controls">
                    <button class="primary" onclick="triggerAction('/api/generate-today')">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                        Generate Today
                    </button>
                    <button onclick="triggerAction('/api/generate-blog')">Blog</button>
                    <button onclick="triggerAction('/api/generate-social')">Social</button>
                    <a href="/api/export" class="btn">Export</a>
                </div>
            </header>

            <!-- History Section -->
            <div class="history-section">
                <div class="flex gap-1 p-1 bg-[var(--color-surface-default)] border border-[var(--color-border)] rounded-xl mb-4 w-fit" style="display:inline-flex; border-radius: 12px; background: var(--color-surface-default); border: 1px solid var(--color-border); padding: 4px;">
                    <button class="px-5 py-2 rounded-lg text-[0.82rem] font-semibold transition-all capitalize bg-grad-primary text-white shadow-sm" style="border:none; padding: 8px 20px; color: white;">All Generations</button>
                </div>

                {% if history %}
                <div class="history-grid">
                    {% for item in history %}
                    <div class="history-item">
                        <div class="item-header-visual bg-grad-soft">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-primary)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3">
                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                            <span class="item-type-badge">{{ item.type }}</span>
                        </div>
                        <div class="item-body">
                            <h3 class="item-topic">{{ item.topic }}</h3>
                            <div class="item-content" data-raw="{{ item.content | e }}"></div>
                            <div class="item-actions">
                                <button class="action-btn" onclick="regenerateContent(this, '{{ item.topic }}', '{{ item.type }}')">Regenerate</button>
                                <button class="action-btn" onclick="copyContent(this, `{{ item.content | replace('`', '\\`') | replace('$', '\\$') }}`)">Copy</button>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                {% else %}
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 16px auto; opacity: 0.5;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                    </svg>
                    <p style="color: var(--color-text-muted); font-size: 0.88rem; margin-bottom: 16px;">No content generated yet.</p>
                    <button class="primary" onclick="triggerAction('/api/generate-today')">Generate your first content</button>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <div id="notification" class="notification success">Action triggered successfully.</div>

    <!-- Loading overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-msg" style="color: #e8eaf6; font-size: 1rem; font-weight: 700; margin: 0; font-family: var(--font-head);">Generating content...</p>
        <p style="color: var(--color-text-muted); font-size: 0.85rem; margin: 0;">This may take 30–90 seconds. Please wait.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            marked.setOptions({ breaks: true, gfm: true });
            document.querySelectorAll('.item-content[data-raw]').forEach(el => {
                const raw = el.getAttribute('data-raw');
                try {
                    el.innerHTML = marked.parse(raw);
                } catch (e) {
                    el.textContent = raw;
                }
            });
        });

        function showNotification(message, isError = false) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = 'notification ' + (isError ? 'error' : 'success');
            
            // force reflow
            void notif.offsetWidth;
            
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 4000);
        }

        function showLoader(msg = 'Generating content...') {
            document.getElementById('loading-msg').textContent = msg;
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoader() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function pollJob(job_id, startMsg) {
            showLoader(startMsg);
            showNotification(startMsg);

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/status/${job_id}`);
                    const data = await res.json();

                    if (data.status === 'done') {
                        clearInterval(interval);
                        hideLoader();
                        showNotification('✓ ' + data.message);
                        setTimeout(() => window.location.reload(), 1500);
                    } else if (data.status === 'error') {
                        clearInterval(interval);
                        hideLoader();
                        showNotification('✗ ' + data.message, true);
                    }
                } catch (err) {
                    clearInterval(interval);
                    hideLoader();
                    showNotification('Network error while polling job status.', true);
                }
            }, 2000);
        }

        async function triggerAction(endpoint) {
            try {
                const response = await fetch(endpoint, { method: 'POST' });
                const data = await response.json();

                if (data.status === 'running') {
                    pollJob(data.job_id, data.message);
                } else if (data.status === 'success') {
                    showNotification(data.message);
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showNotification(data.message, true);
                }
            } catch (error) {
                showNotification('Network error occurred.', true);
            }
        }

        async function copyContent(btn, text) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                btn.style.color = 'var(--color-text-primary)';
                btn.style.borderColor = 'var(--color-accent-primary)';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = '';
                    btn.style.borderColor = '';
                }, 2000);
            } catch (err) {
                showNotification('Failed to copy', true);
            }
        }

        async function regenerateContent(btn, topic, type) {
            const originalText = btn.innerText;
            btn.innerText = 'Starting...';
            btn.disabled = true;
            try {
                const response = await fetch('/api/regenerate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, type })
                });
                const data = await response.json();

                if (data.status === 'running') {
                    pollJob(data.job_id, data.message);
                } else if (data.status === 'success') {
                    showNotification(data.message);
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    showNotification(data.message, true);
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showNotification('Network error occurred.', true);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
